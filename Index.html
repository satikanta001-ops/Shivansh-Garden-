<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shivansh Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#1a3a2a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Shivansh Garden"/>
<link rel="manifest" href="manifest.json"/>
<style>
  /* ── TOKENS ── */
  :root {
    --green-deep:   #1a3a2a;
    --green-mid:    #2d5c42;
    --green-accent: #4a8c63;
    --green-light:  #a8d5b5;
    --gold:         #c9a84c;
    --gold-light:   #e8c97a;
    --cream:        #faf6ee;
    --cream-dark:   #f0e9d8;
    --text-dark:    #1a1a14;
    --text-mid:     #4a4a3a;
    --text-soft:    #7a7a6a;
    --white:        #ffffff;
    --sidebar-w:    260px;
    --topbar-h:     64px;
    --radius:       12px;
    --shadow-sm:    0 2px 8px rgba(26,58,42,.08);
    --shadow-md:    0 6px 24px rgba(26,58,42,.13);
    --shadow-lg:    0 16px 48px rgba(26,58,42,.18);
    --transition:   .22s cubic-bezier(.4,0,.2,1);
    --tint-a:       #faf6ee;
    --tint-b:       #f3f8f0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(165deg, var(--tint-a) 0%, var(--tint-b) 100%);
    background-attachment: fixed;
    transition: background 4s ease;
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--green-deep);
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform var(--transition);
    overflow: hidden;
  }

  /* decorative leaf pattern */
  .sidebar::before {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 40px solid rgba(74,140,99,.12);
    pointer-events: none;
  }
  .sidebar::after {
    content: '';
    position: absolute;
    top: 200px; left: -80px;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 30px solid rgba(201,168,76,.07);
    pointer-events: none;
  }

  .sidebar-brand {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
    z-index: 1;
  }
  .brand-leaf {
    font-size: 28px;
    margin-bottom: 4px;
    display: block;
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.1;
    letter-spacing: .3px;
  }
  .brand-tagline {
    font-size: 10px;
    color: var(--green-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 3px;
    font-weight: 500;
  }

  .sidebar-nav {
    flex: 1;
    padding: 20px 0;
    overflow-y: auto;
    position: relative;
    z-index: 1;
  }
  .nav-section-label {
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(168,213,181,.45);
    padding: 16px 24px 6px;
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 20px 11px 24px;
    color: rgba(250,246,238,.65);
    cursor: pointer;
    border-radius: 0;
    transition: all var(--transition);
    font-size: 14px;
    font-weight: 400;
    position: relative;
    margin: 1px 0;
    border-left: 3px solid transparent;
    text-decoration: none;
  }
  .nav-item:hover {
    color: var(--cream);
    background: rgba(255,255,255,.06);
    border-left-color: rgba(201,168,76,.4);
  }
  .nav-item.active {
    color: var(--gold-light);
    background: rgba(201,168,76,.1);
    border-left-color: var(--gold);
    font-weight: 500;
  }
  .nav-item .nav-icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .nav-badge {
    margin-left: auto;
    background: var(--gold);
    color: var(--green-deep);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(255,255,255,.08);
    position: relative;
    z-index: 1;
  }
  .user-card {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green-accent), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }
  .user-info .user-name { font-size: 13px; color: var(--cream); font-weight: 500; }
  .user-info .user-role { font-size: 10px; color: var(--green-light); letter-spacing: .5px; }

  /* ── TOPBAR ── */
  .topbar {
    position: fixed;
    top: 0;
    left: var(--sidebar-w);
    right: 0;
    height: var(--topbar-h);
    background: rgba(250,246,238,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(26,58,42,.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 90;
    gap: 12px;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .topbar-left h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--green-deep);
    letter-spacing: .2px;
  }
  .topbar-left .breadcrumb {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 1px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-date {
    font-size: 12px;
    color: var(--text-soft);
    background: var(--cream-dark);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(26,58,42,.1);
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--cream-dark);
    border: 1px solid rgba(26,58,42,.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all var(--transition);
    position: relative;
  }
  .icon-btn:hover { background: var(--green-light); border-color: var(--green-accent); }
  .notif-dot {
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gold);
    border: 1.5px solid var(--cream);
  }

  /* ── NOTIFICATION PANEL ── */
  .notif-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 18px; cursor: pointer;
    transition: background .15s; border-bottom: 1px solid rgba(26,58,42,.05);
    text-decoration: none; color: inherit;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--cream); }
  .notif-item.unread { background: rgba(201,168,76,.06); }
  .notif-item.unread:hover { background: rgba(201,168,76,.12); }
  .notif-icon {
    flex-shrink: 0; width: 34px; height: 34px;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 15px; margin-top: 1px;
  }
  .ni-warning  { background: rgba(201,168,76,.15); }
  .ni-danger   { background: rgba(192,64,64,.12); }
  .ni-info     { background: rgba(42,122,106,.1); }
  .ni-success  { background: rgba(45,92,66,.1); }
  .notif-body  { flex: 1; min-width: 0; }
  .notif-title { font-size: 13px; font-weight: 600; color: var(--text-dark); line-height: 1.3; }
  .notif-sub   { font-size: 11px; color: var(--text-soft); margin-top: 2px; line-height: 1.4; }
  .notif-time  { font-size: 10px; color: var(--text-soft); margin-top: 3px; }
  .notif-empty { text-align:center; padding: 48px 20px; color: var(--text-soft); font-size: 13px; }
  .notif-section-label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-soft); font-weight: 700;
    padding: 10px 18px 4px; background: none;
  }

  /* ── MAIN ── */
  .main {
    margin-left: var(--sidebar-w);
    padding-top: var(--topbar-h);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .page { display: none; padding: 32px; animation: fadeIn .3s ease; }
  .page.active { display: block; }
  /* Opacity-only on purpose: a transform here (even inside a @keyframes
     animation) turns this element into a new containing block for any
     position:fixed descendant — which breaks every modal opened from inside
     a page, making it anchor to this div's box instead of the real viewport. */
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* ── DASHBOARD PAGE ── */
  .dash-greeting {
    margin-bottom: 28px;
  }
  .dash-greeting h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--green-deep);
  }
  .dash-greeting p { color: var(--text-soft); font-size: 14px; margin-top: 4px; }

  /* stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px 24px;
    border: 1px solid rgba(26,58,42,.07);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform var(--transition), box-shadow var(--transition);
    cursor: default;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 var(--radius) 0 80px;
    opacity: .08;
  }
  .stat-card.green::after  { background: var(--green-deep); }
  .stat-card.gold::after   { background: var(--gold); }
  .stat-card.teal::after   { background: #2a7a6a; }
  .stat-card.rose::after   { background: #8a3a3a; }

  .stat-icon { font-size: 26px; margin-bottom: 10px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-soft); font-weight: 600; }
  .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 700; color: var(--green-deep); line-height: 1; margin: 4px 0 2px; }
  .stat-sub { font-size: 12px; color: var(--text-soft); }
  .stat-trend { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .trend-up   { color: #2d7a4a; }
  .trend-down { color: #8a3a3a; }

  /* content grid */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    margin-bottom: 20px;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid rgba(26,58,42,.07);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid rgba(26,58,42,.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--green-deep);
  }
  .card-action {
    font-size: 12px;
    color: var(--green-accent);
    cursor: pointer;
    font-weight: 500;
    transition: color var(--transition);
  }
  .card-action:hover { color: var(--green-deep); }
  .card-body { padding: 16px 22px; }

  /* upcoming events */
  .event-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(26,58,42,.05);
  }
  .event-item:last-child { border-bottom: none; }
  .event-date-box {
    width: 44px; height: 44px;
    background: var(--green-deep);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--cream);
  }
  .event-date-box .day { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; line-height: 1; }
  .event-date-box .mon { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--green-light); }
  .event-info .event-name { font-size: 14px; font-weight: 500; color: var(--text-dark); }
  .event-info .event-meta { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .event-badge {
    margin-left: auto;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .badge-confirmed { background: rgba(45,92,66,.12); color: var(--green-mid); }
  .badge-pending   { background: rgba(201,168,76,.15); color: #8a6a10; }
  .badge-prep      { background: rgba(42,122,106,.12); color: #1a5a4a; }

  /* quick actions */
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 22px;
  }
  .quick-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 10px;
    background: var(--cream);
    border: 1px solid rgba(26,58,42,.09);
    border-radius: 10px;
    cursor: pointer;
    transition: all var(--transition);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    text-align: center;
  }
  .quick-btn:hover {
    background: var(--green-deep);
    color: var(--cream);
    border-color: var(--green-deep);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  .quick-btn .qicon { font-size: 22px; }

  /* activity feed */
  .activity-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(26,58,42,.05);
    align-items: flex-start;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .dot-green { background: var(--green-accent); }
  .dot-gold  { background: var(--gold); }
  .dot-blue  { background: #3a6a9a; }
  .dot-rose  { background: #9a4a4a; }
  .activity-text { font-size: 13px; color: var(--text-mid); line-height: 1.4; }
  .activity-time { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  /* bottom row */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  /* staff status */
  .staff-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(26,58,42,.05);
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-avatar-sm {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: white;
    flex-shrink: 0;
  }
  .av-a { background: linear-gradient(135deg, #2d5c42, #4a8c63); }
  .av-b { background: linear-gradient(135deg, #5c4a2d, #8c6a4a); }
  .av-c { background: linear-gradient(135deg, #2d4a5c, #4a6a8c); }
  .av-d { background: linear-gradient(135deg, #5c2d42, #8c4a63); }
  .staff-name-sm { font-size: 13px; font-weight: 500; color: var(--text-dark); }
  .staff-role-sm { font-size: 11px; color: var(--text-soft); }
  .status-pill {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .s-present { background: rgba(45,92,66,.12); color: #1a5a2a; }
  .s-leave   { background: rgba(201,168,76,.15); color: #7a5a10; }
  .s-absent  { background: rgba(138,58,58,.1); color: #7a2a2a; }

  /* mini bar chart */
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 80px;
    padding: 0 0 8px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .bar-fill {
    width: 100%;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(to top, var(--green-mid), var(--green-accent));
    transition: height .5s ease;
  }
  .bar-fill.gold-bar { background: linear-gradient(to top, #a07030, var(--gold)); }
  .bar-label { font-size: 9px; color: var(--text-soft); letter-spacing: .5px; }

  /* inventory widget */
  .inv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(26,58,42,.05);
    font-size: 13px;
  }
  .inv-item:last-child { border-bottom: none; }
  .inv-name { color: var(--text-dark); font-weight: 400; }
  .inv-bar-wrap { width: 80px; height: 5px; background: var(--cream-dark); border-radius: 3px; margin: 0 10px; }
  .inv-bar-fill { height: 100%; border-radius: 3px; }
  .fill-ok  { background: var(--green-accent); }
  .fill-low { background: var(--gold); }
  .fill-crit{ background: #c04040; }
  .inv-qty { font-size: 12px; color: var(--text-soft); }

  /* placeholder pages */
  .coming-soon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    gap: 16px;
  }
  .coming-soon .cs-icon { font-size: 64px; opacity: .3; }
  .coming-soon h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: var(--green-deep);
    opacity: .5;
  }
  .coming-soon p { font-size: 14px; color: var(--text-soft); }

  /* FAB sidebar backdrop */
  .fab-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,30,18,.45);
    backdrop-filter: blur(2px);
    z-index: 99;
    opacity: 0;
    transition: opacity .3s;
  }
  .fab-backdrop.visible { display: block; }
  .fab-backdrop.active  { opacity: 1; }

  /* Nav items stagger in */
  .sidebar.open .nav-item {
    animation: navItemIn .3s ease both;
  }
  .sidebar.open .nav-item:nth-child(1)  { animation-delay: .12s }
  .sidebar.open .nav-item:nth-child(2)  { animation-delay: .16s }
  .sidebar.open .nav-item:nth-child(3)  { animation-delay: .20s }
  .sidebar.open .nav-item:nth-child(4)  { animation-delay: .22s }
  .sidebar.open .nav-item:nth-child(5)  { animation-delay: .24s }
  .sidebar.open .nav-item:nth-child(6)  { animation-delay: .26s }
  .sidebar.open .nav-item:nth-child(7)  { animation-delay: .28s }
  .sidebar.open .nav-item:nth-child(8)  { animation-delay: .30s }
  .sidebar.open .nav-item:nth-child(9)  { animation-delay: .32s }
  .sidebar.open .nav-item:nth-child(10) { animation-delay: .34s }
  .sidebar.open .nav-item:nth-child(11) { animation-delay: .36s }
  .sidebar.open .nav-item:nth-child(12) { animation-delay: .38s }
  @keyframes navItemIn {
    from { opacity:0; transform: translateX(-18px); }
    to   { opacity:1; transform: translateX(0); }
  }

  /* master checklist tabs */
  .mcl-tab-btn { background: var(--cream); color: var(--text-mid); transition: all .15s; }
  .mcl-tab-btn.active { background: rgba(45,92,66,.15); color: #1a5a2a; }

  /* mobile toggle FAB */
  .mob-toggle {
    display: flex;
    position: fixed;
    bottom: 28px;
    left: 20px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--green-deep);
    color: #fff;
    font-size: 22px;
    border: none;
    cursor: grab;
    align-items: center; justify-content: center;
    z-index: 300;
    box-shadow: 0 6px 24px rgba(26,58,42,.35), 0 2px 8px rgba(0,0,0,.18);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    transition: box-shadow .15s, transform .1s;
    user-select: none;
  }
  /* hide FAB on desktop where sidebar is always visible */
  @media (min-width: 901px) {
    .mob-toggle { display: none; }
    .fab-backdrop { display: none !important; }
